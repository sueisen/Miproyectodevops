<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .page-container { max-width: 900px; margin-top: 60px; margin-bottom: 60px; }
    </style>
</head>
<body>

<div class="container page-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Proyectos</h3>
        <div>
            <button type="button" class="btn btn-primary" id="btnNuevoProyecto">+ Nuevo proyecto</button>
            <button type="button" class="btn btn-outline-secondary" id="btnLogout">Cerrar sesión</button>
        </div>
    </div>

    <div id="listErrorMessage" class="alert alert-danger d-none" role="alert"></div>

    <div class="table-responsive shadow-sm bg-white rounded">
        <table class="table align-middle mb-0">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Creado</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="projectsTableBody">
            </tbody>
        </table>
    </div>
    <p id="emptyMessage" class="text-muted text-center mt-3 d-none">No hay proyectos todavía.</p>
</div>

<!-- Modal crear/editar proyecto -->
<div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="projectForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="projectModalTitle">Nuevo proyecto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="projectId">

                    <div class="mb-3">
                        <label for="projectName" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="projectName" required>
                    </div>

                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">Descripción</label>
                        <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                    </div>

                    <div id="formErrorMessage" class="alert alert-danger d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const tableBody = document.getElementById('projectsTableBody');
const emptyMessage = document.getElementById('emptyMessage');
const listErrorMessage = document.getElementById('listErrorMessage');

const projectModalEl = document.getElementById('projectModal');
const projectModal = new bootstrap.Modal(projectModalEl);
const projectModalTitle = document.getElementById('projectModalTitle');
const projectForm = document.getElementById('projectForm');
const projectIdInput = document.getElementById('projectId');
const projectNameInput = document.getElementById('projectName');
const projectDescriptionInput = document.getElementById('projectDescription');
const formErrorMessage = document.getElementById('formErrorMessage');

document.getElementById('btnNuevoProyecto').addEventListener('click', () => {
    openModal();
});

document.getElementById('btnLogout').addEventListener('click', () => {
    window.location.href = '/pages/login.html';
});

projectForm.addEventListener('submit', handleSubmit);
projectModalEl.addEventListener('hidden.bs.modal', resetForm);

loadProjects();

function openModal(project = null) {
    resetForm();
    if (project) {
        projectModalTitle.textContent = 'Editar proyecto';
        projectIdInput.value = project.id;
        projectNameInput.value = project.name;
        projectDescriptionInput.value = project.description || '';
    } else {
        projectModalTitle.textContent = 'Nuevo proyecto';
    }
    projectModal.show();
}

function resetForm() {
    projectForm.reset();
    projectIdInput.value = '';
    formErrorMessage.classList.add('d-none');
}

async function loadProjects() {
    listErrorMessage.classList.add('d-none');
    try {
        const response = await fetch('/api/projects');
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'No se pudieron cargar los proyectos.');
        }

        renderProjects(data.projects);
    } catch (error) {
        listErrorMessage.textContent = error.message;
        listErrorMessage.classList.remove('d-none');
    }
}

function renderProjects(projects) {
    tableBody.innerHTML = '';

    if (!projects || projects.length === 0) {
        emptyMessage.classList.remove('d-none');
        return;
    }
    emptyMessage.classList.add('d-none');

    for (const project of projects) {
        const row = document.createElement('tr');

        const createdAt = project.created_at ? new Date(project.created_at).toLocaleString() : '';

        row.innerHTML = `
            <td>${escapeHtml(project.name)}</td>
            <td>${escapeHtml(project.description || '')}</td>
            <td>${createdAt}</td>
            <td class="text-end">
                <button type="button" class="btn btn-sm btn-outline-secondary btnEditar">Editar</button>
                <button type="button" class="btn btn-sm btn-outline-danger btnEliminar">Eliminar</button>
            </td>
        `;

        row.querySelector('.btnEditar').addEventListener('click', () => openModal(project));
        row.querySelector('.btnEliminar').addEventListener('click', () => handleDelete(project));

        tableBody.appendChild(row);
    }
}

async function handleSubmit(event) {
    event.preventDefault();
    formErrorMessage.classList.add('d-none');

    const id = projectIdInput.value;
    const payload = {
        name: projectNameInput.value.trim(),
        description: projectDescriptionInput.value.trim() || null
    };

    try {
        const response = await fetch(id ? `/api/projects/${id}` : '/api/projects', {
            method: id ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'No se pudo guardar el proyecto.');
        }

        projectModal.hide();
        await loadProjects();
    } catch (error) {
        formErrorMessage.textContent = error.message;
        formErrorMessage.classList.remove('d-none');
    }
}

async function handleDelete(project) {
    if (!confirm(`¿Eliminar el proyecto "${project.name}"?`)) {
        return;
    }

    try {
        const response = await fetch(`/api/projects/${project.id}`, { method: 'DELETE' });
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'No se pudo eliminar el proyecto.');
        }

        await loadProjects();
    } catch (error) {
        listErrorMessage.textContent = error.message;
        listErrorMessage.classList.remove('d-none');
    }
}

function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value;
    return div.innerHTML;
}
</script>

</body>
</html>

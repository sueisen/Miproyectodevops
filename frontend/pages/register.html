<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .register-container { max-width: 400px; margin-top: 100px; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="register-container p-4 shadow bg-white rounded w-100">
        <h3 class="text-center mb-4">Crear cuenta</h3>

        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="name">
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100">Registrarme</button>
        </form>

        <p class="text-center mt-3 mb-0">
            <a href="/pages/login.html">Ya tengo cuenta, iniciar sesión</a>
        </p>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const nameInput = document.getElementById('name');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorDiv = document.getElementById('errorMessage');

    errorDiv.classList.add('d-none');

    if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
        errorDiv.textContent = 'Usuario y contraseña son obligatorios.';
        errorDiv.classList.remove('d-none');
        return;
    }

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: nameInput.value.trim() || null,
                username: usernameInput.value.trim(),
                password: passwordInput.value
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            errorDiv.textContent = data.message || 'No se pudo registrar el usuario.';
            errorDiv.classList.remove('d-none');
            return;
        }

        alert('Usuario registrado correctamente. Ahora inicia sesión.');
        window.location.href = '/pages/login.html';
    } catch (error) {
        console.error('Error al conectar con el servidor:', error);
        errorDiv.textContent = 'Error al conectar con el servidor.';
        errorDiv.classList.remove('d-none');
    }
});
</script>

</body>
</html>

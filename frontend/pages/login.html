<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .login-container { max-width: 400px; margin-top: 100px; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-container p-4 shadow bg-white rounded w-100">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        
        <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" required>
                <div class="invalid-feedback">Por favor, ingresa tu usuario.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
                <div class="invalid-feedback">Por favor, ingresa tu contraseña.</div>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorDiv = document.getElementById('errorMessage');

    // Ocultar alertas anteriores
    errorDiv.classList.add('d-none');

    // 1. Validación local (Campos vacíos) antes de enviar
    if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
        errorDiv.textContent = "Campos vacíos no permiten enviar el formulario.";
        errorDiv.classList.remove('d-none');
        return;
    }

    try {
        // Enviar datos al endpoint que creamos en el backend
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: usernameInput.value, 
                password: passwordInput.value 
            })
        });

        const data = await response.json();

        if (!response.ok) {
            // Manejar errores: Usuario incorrecto o Contraseña incorrecta
            errorDiv.textContent = data.message;
            errorDiv.classList.remove('d-none');
        } else {
            // Éxito: Usuario válido inicia sesión
            alert(data.message);
            window.location.href = '/dashboard'; // Redirige al Dashboard
        }
    } catch (error) {
        console.error("Error al conectar con el servidor:", error);
    }
});
</script>

</body>
</html>
